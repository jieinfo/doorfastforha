unlock:
  name: Unlock door
  description: Submit a Doorfast unlock command.
  fields:
    config_entry_id:
      description: Required only when multiple Doorfast entries are loaded.
      selector: {text: {}}
    generation:
      description: Defaults to the generation of the current call.
      selector: {number: {min: 1}}
call_elevator:
  name: Call elevator
  description: Request an elevator in the selected direction.
  fields:
    config_entry_id:
      description: Required only when multiple Doorfast entries are loaded.
      selector: {text: {}}
    direction:
      required: true
      default: up
      selector: {select: {options: [up, down]}}
answer:
  name: Answer call
  description: Accept the active Doorfast call and configure media ports.
  fields:
    config_entry_id:
      description: Required only when multiple Doorfast entries are loaded.
      selector: {text: {}}
    generation:
      required: true
      selector: {number: {min: 1}}
    primary_media_port:
      default: 0
      selector: {number: {min: 0, max: 65535}}
    secondary_media_port:
      default: 0
      selector: {number: {min: 0, max: 65535}}
    duration_seconds:
      default: 0
      selector: {number: {min: 0, max: 3600}}
hangup:
  name: Hang up
  description: Terminate the active Doorfast call.
  fields:
    config_entry_id:
      description: Required only when multiple Doorfast entries are loaded.
      selector: {text: {}}
    generation:
      description: Defaults to the generation of the current call.
      selector: {number: {min: 1}}
    reason:
      default: ha
      selector: {text: {}}
