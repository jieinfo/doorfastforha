name: Publish HACS release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching custom_components/doorfast/manifest.json, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and validate release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          version="$(python3 -c 'import json; print(json.load(open("custom_components/doorfast/manifest.json"))["version"])')"
          test "$tag" = "v$version"
          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Doorfast $VERSION" --generate-notes
